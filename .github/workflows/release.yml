name: Publish PandaQuest release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: pandaquest-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Validate the addon version
        shell: bash
        run: |
          toc_version="$(sed -n 's/^## Version: //p' pandaQuest.toc | tr -d '\r ')"
          tag_version="${GITHUB_REF_NAME#v}"

          test -n "$toc_version"
          test "$toc_version" = "$tag_version"
          python3 -B tools/release.py check --release "$tag_version"
          python3 -B tools/release.py notes "$tag_version" > release-notes.md

      - name: Package PandaQuest
        shell: bash
        run: |
          # Zips only player files (runtime folders, TOC, licence, README,
          # changelog) under a pandaQuest/ folder, and fails if any file the
          # TOC lists is missing from the package.
          python3 -B tools/release.py package --output PandaQuest.zip

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" PandaQuest.zip \
            --verify-tag \
            --title "PandaQuest ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --latest
